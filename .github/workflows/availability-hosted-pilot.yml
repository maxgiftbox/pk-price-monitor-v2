name: Stock Availability Hosted Pilot

on:
  workflow_dispatch:
    inputs:
      products_per_venture:
        description: Representative products selected per country (PK, BD, NP)
        required: true
        default: "8"
        type: string

jobs:
  hosted-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Crawl representative products without publishing production data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AVAILABILITY_CURRENT_TAB: drz_availability_hosted_pilot
          AVAILABILITY_STAGING_TAB: drz_availability_hosted_pilot_staging
          AVAILABILITY_RUN_LOG_TAB: availability_hosted_pilot_run_log
          AVAILABILITY_PILOT_PRODUCTS_PER_VENTURE: ${{ inputs.products_per_venture }}
          AVAILABILITY_FALLBACK_WORKERS: "4"
          AVAILABILITY_CHECKPOINT_PRODUCTS: "3"
          AVAILABILITY_CHECKPOINT_FALLBACKS: "3"
          AVAILABILITY_BATCH_MINUTES: "0"
          PYTHONUNBUFFERED: "1"
        run: python availability_crawler.py

      - name: Upload hosted pilot debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-hosted-pilot-debug-${{ github.run_attempt }}
          path: debug_availability/**
          if-no-files-found: warn
          retention-days: 7
