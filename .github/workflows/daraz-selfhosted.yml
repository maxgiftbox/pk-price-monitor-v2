name: Daraz Self-hosted Production Pilot

on:
  workflow_dispatch:

jobs:
  crawl-daraz:
    runs-on:
      - self-hosted
      - daraz-local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run full Daraz PK and BD crawl
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python daraz_selfhosted.py

      - name: Upload Daraz self-hosted debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daraz-selfhosted-debug
          path: |
            debug_daraz_selfhosted/**
            output/daraz_selfhosted_run_summary.csv
          if-no-files-found: warn
          retention-days: 7
