name: Weekly Brief Refresh

on:
  schedule:
    # 02:00 UTC is 08:00 in Asia/Dhaka. The completed period ends Saturday.
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Warm Pakistan and Bangladesh briefs
        env:
          BRIEF_URL: https://daraz-el-intelligence.onrender.com/api/weekly-brief
        run: |
          for country in PK BD; do
            curl --fail --show-error --silent --retry 4 --retry-all-errors --max-time 90 "${BRIEF_URL}?country=${country}" > /dev/null
          done
          sleep 45
          for country in PK BD; do
            curl --fail --show-error --silent --retry 4 --retry-all-errors --max-time 90 "${BRIEF_URL}?country=${country}" > /dev/null
          done
