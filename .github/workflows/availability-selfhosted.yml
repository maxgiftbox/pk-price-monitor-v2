name: Stock Availability Manual Crawl

on:
  workflow_dispatch:

jobs:
  crawl-availability:
    runs-on:
      - self-hosted
      - daraz-local
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          /opt/homebrew/bin/python3.11 --version
          /opt/homebrew/bin/python3.11 -m pip --version

      - name: Install dependencies
        run: /opt/homebrew/bin/python3.11 -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: /opt/homebrew/bin/python3.11 -m playwright install chromium

      - name: Crawl all Daraz variant SKUs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AVAILABILITY_FALLBACK_WORKERS: "3"
        run: /usr/bin/caffeinate -dimsu /opt/homebrew/bin/python3.11 availability_crawler.py

      - name: Upload availability debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-debug
          path: debug_availability/**
          if-no-files-found: warn
          retention-days: 7
