name: Stock Availability Manual Crawl

on:
  workflow_dispatch:

jobs:
  batch-1:
    runs-on:
      - self-hosted
      - daraz-local
    timeout-minutes: 45
    outputs:
      complete: ${{ steps.batch.outputs.complete }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run batch 1
        id: batch
        uses: ./.github/actions/availability-batch
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Upload availability debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-debug
          path: debug_availability/**
          if-no-files-found: warn
          retention-days: 7

  batch-2:
    needs: batch-1
    if: needs.batch-1.result == 'success' && needs.batch-1.outputs.complete != 'true'
    uses: ./.github/workflows/availability-batch-reusable.yml
    with:
      batch_number: "2"
    secrets: inherit

  batch-3:
    needs: batch-2
    if: ${{ !cancelled() && needs.batch-2.result == 'success' && needs.batch-2.outputs.complete != 'true' }}
    uses: ./.github/workflows/availability-batch-reusable.yml
    with:
      batch_number: "3"
    secrets: inherit

  batch-4:
    needs: batch-3
    if: ${{ !cancelled() && needs.batch-3.result == 'success' && needs.batch-3.outputs.complete != 'true' }}
    uses: ./.github/workflows/availability-batch-reusable.yml
    with:
      batch_number: "4"
    secrets: inherit
