name: Availability crawl batch

on:
  workflow_call:
    inputs:
      batch_number:
        description: Sequential batch number used for artifact naming
        required: true
        type: string
    outputs:
      complete:
        description: Whether the complete snapshot was published
        value: ${{ jobs.batch.outputs.complete }}

jobs:
  batch:
    runs-on:
      - self-hosted
      - daraz-local
    timeout-minutes: 45
    outputs:
      complete: ${{ steps.batch.outputs.complete }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run next batch
        id: batch
        uses: ./.github/actions/availability-batch
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Upload availability debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-debug-batch-${{ inputs.batch_number }}-${{ github.run_attempt }}
          path: debug_availability/**
          if-no-files-found: warn
          retention-days: 7
