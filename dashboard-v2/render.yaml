services:
  - type: web
    name: daraz-el-intelligence-api
    runtime: python
    rootDir: dashboard-v2/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: Mob Price Monitor
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PRICING_CACHE_TTL_SECONDS
        value: 900
      - key: PRICING_INITIAL_LOAD_TIMEOUT_SECONDS
        value: 12
      - key: PRICING_RESPONSE_CACHE_TTL_SECONDS
        value: 900
      - key: PRICING_RESPONSE_CACHE_MAX_ENTRIES
        value: 256
