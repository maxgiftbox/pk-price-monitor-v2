[project]
name = "price-monitor-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.0,<3", "gspread>=6,<7", "google-auth>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
